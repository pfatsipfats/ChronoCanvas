<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChronoCanvas — Time Canvas Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #2a2a2a;
      padding: 0.75rem 2rem;
      border-bottom: 1px solid #3a3a3a;
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }

    h1 { font-size: 1.2rem; font-weight: 600; }
    .subtitle { font-size: 0.85rem; color: #999; }

    main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    #canvas-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
    }
    #canvas-container:active { cursor: grabbing; }

    #timescale {
      display: block;
      width: 100%;
      height: 36px;
      flex-shrink: 0;
      border-top: 1px solid #3a3a3a;
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.1rem;
      color: #888;
    }

    .controls {
      background: #2a2a2a;
      padding: 0.75rem 2rem;
      border-top: 1px solid #3a3a3a;
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .controls-label {
      font-size: 0.78rem;
      color: #777;
      margin-right: 0.25rem;
    }

    button {
      background: #3a4a6a;
      color: #d0d8ee;
      border: 1px solid #4a5a7a;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    button:hover { background: #4a5a8a; }
    button:active { background: #2a3a5a; }
    button.primary {
      background: #4a90e2;
      border-color: #5aa0f2;
      color: white;
    }
    button.primary:hover { background: #357abd; }

    .divider {
      width: 1px;
      height: 24px;
      background: #3a3a3a;
      margin: 0 0.25rem;
    }

    .info {
      margin-left: auto;
      font-size: 0.78rem;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>ChronoCanvas — Time Canvas</h1>
    <span class="subtitle">Human Civilization · 500 BCE – present · scroll to zoom · drag to pan · click to navigate</span>
  </header>

  <main>
    <div id="canvas-container">
      <div class="loading" id="loading">Building timeline…</div>
    </div>

    <canvas id="timescale"></canvas>

    <div class="controls">
      <span class="controls-label">View:</span>
      <button class="primary" id="btn-fit">Fit All</button>

      <div class="divider"></div>
      <span class="controls-label">Era:</span>
      <button id="btn-ancient">Ancient World</button>
      <button id="btn-medieval">Medieval</button>
      <button id="btn-early-modern">Early Modern</button>
      <button id="btn-modern">Modern Era</button>

      <div class="info">Click a timeline or infodot to navigate · ESC to fit</div>
    </div>
  </main>

  <script type="module" src="/time-canvas-main.ts"></script>
</body>
</html>
